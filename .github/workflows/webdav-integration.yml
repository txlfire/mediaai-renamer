name: WebDAV Integration

on:
  pull_request:
    paths:
      - "backend/app/api/remote_operations.py"
      - "backend/app/service/remote_operation*.py"
      - "backend/app/service/shared_protocols/**"
      - "backend/tests/integration/**"
      - "scripts/test-webdav-integration.sh"
      - "tests/integration/webdav/**"
      - ".github/workflows/webdav-integration.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/app/api/remote_operations.py"
      - "backend/app/service/remote_operation*.py"
      - "backend/app/service/shared_protocols/**"
      - "backend/tests/integration/**"
      - "scripts/test-webdav-integration.sh"
      - "tests/integration/webdav/**"
      - ".github/workflows/webdav-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webdav-integration:
    name: HTTPS WebDAV protocol integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run HTTPS WebDAV integration tests
        run: bash scripts/test-webdav-integration.sh

      - name: Upload sanitized WebDAV logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-integration-logs
          path: .codex/test-artifacts/webdav-integration.log
          if-no-files-found: ignore
          retention-days: 7
