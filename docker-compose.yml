services:
  mediaai:
    image: mediaai-renamer:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mediaai-renamer
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    ports:
      - "8970:8970"
      - "8971:8970"
