# MediaAI Renamer v1.4.0 配置示例

[server]
host = "0.0.0.0"
port = 8970

[paths]
data_dir = "/app/data"
# 默认 data_dir/secrets/credentials.key；可改为单独的持久化挂载。
# 环境秘密 MEDIAAI_CREDENTIAL_KEY 优先，值为 Fernet 格式的随机密钥。
# credential_key_file = "/app/secrets/credentials.key"

[logging]
level = "INFO"
log_dir = "/app/logs"
max_size_mb = 10
backup_count = 5
console_output = true

[scan]
batch_size = 100
batch_interval_seconds = 1
# 异步扫描任务总时间上限；超时不自动重放，单位秒。
task_timeout_seconds = 3600
minimum_file_size = 0

[auth]
# 仅用于无人值守部署；默认关闭，首次启动通过登录页初始化管理员。
default_admin_enabled = false
default_admin_username = "admin"
default_admin_display_name = "系统管理员"
default_admin_password = "123456"
admin_password_reset_enabled = false

# 后台探测/匹配任务；修改后重启。结果清理不删除审计或幂等请求ID，也不自动重放请求。
[background_jobs]
timeout_seconds = 3600
max_queued = 100
result_max_size_mb = 4
result_total_size_mb = 64
retention_days = 7

# 修改后需重启；同一数据库、同一宿主的工作进程共用，不控制本地API或文件操作。
[external_requests]
max_concurrency = 4

[external_requests.ai]
requests_per_second = 2
max_concurrency = 1

[external_requests.metadata]
requests_per_second = 2
max_concurrency = 1

# 可覆盖tmdb/bangumi/tvdb/douban_proxy/imdb；IMDb只有既有可达性测试。
# 相同origin（协议、主机、端口）仍共用槽。
# [external_requests.providers.tmdb]
# requests_per_second = 4
# max_concurrency = 2

# CD2 / 115 目录整理配置在“系统设置”维护并保存于数据库。
# 不再读取 [cloud_drive]，不在文件中保存端点、CA、云密码或临时Token。
